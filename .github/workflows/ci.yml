name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Acquire exact ephemeral runtime inputs
        run: |
          input_dir="${RUNNER_TEMP}/cobblefurnies"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/CobbleFurnies-neoforge-1.2.jar" \
            "https://mediafilez.forgecdn.net/files/8340/192/CobbleFurnies-neoforge-1.2.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/athena-neoforge-1.21.1-4.0.6.jar" \
            "https://cdn.modrinth.com/data/b1ZV3DIJ/versions/dJgL278E/athena-neoforge-1.21.1-4.0.6.jar"

      - name: Run authoritative exact-input gate once
        run: |
          input_dir="${RUNNER_TEMP}/cobblefurnies"
          python3 gallery/generate.py --check
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool \
            src/main/resources/bluemap-cobblefurnies/profiles/exact-artifacts.json \
            >/dev/null
          python3 -m json.tool \
            src/main/resources/bluemap-cobblefurnies/profiles/cobblefurnies/1.2-athena-4.0.6/profile.json \
            >/dev/null
          (cd gallery && sha256sum --check SHA256SUMS)
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PreleaseGate=true \
            -PcobblefurniesJar="${input_dir}/CobbleFurnies-neoforge-1.2.jar" \
            -PathenaJar="${input_dir}/athena-neoforge-1.21.1-4.0.6.jar" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyPinnedArtifacts \
            verifyPublicationMetadata
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          production="build/libs/bluemap-cobblefurnies-addon-${version}.jar"
          sources="build/libs/bluemap-cobblefurnies-addon-${version}-sources.jar"
          test -f "${production}"
          test -f "${sources}"
          unzip -p "${production}" \
            META-INF/bluemap-cobblefurnies/upstreams.json \
            | cmp - provenance/upstreams.json
          unzip -p "${sources}" \
            META-INF/bluemap-cobblefurnies/upstreams.json \
            | cmp - provenance/upstreams.json

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-cobblefurnies-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
