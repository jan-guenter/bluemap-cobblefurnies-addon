pluginManagement {
    def toolkitPath = 'tooling/bluemap-addon-toolkit'
    def expectedToolkitCommit = '6cd34a8368cc4ee8628fbe830a90ec5b14960629'
    def adapterApiPath = 'modules/bluemap-addon-adapter-api'
    def expectedAdapterApiCommit = 'e81f08bc4bfbf02d810ec8949a019130e2e61634'
    def expectedAdapterApiSourceTree = '2f974c9bb2ba13888d69682f86f30f58922d30eb'
    def athenaModelsPath = 'modules/bluemap-athena-resource-models'
    def expectedAthenaModelsCommit = '4a503a63f7f10b7c414c6c1228207a5ba00bfd54'
    def expectedAthenaModelsSourceTree = '882689c2f9a0875547f4e30aefd68659103d5046'
    def renderCorePath = 'modules/bluemap-addon-render-core'
    def expectedRenderCoreCommit = '24b84efdc8235f3f1323e1a8e9fd033080e3a79e'
    def expectedRenderCoreSourceTree = '424040931680fb82d37693f893ca887c0ed48eae'
    def consumerRoot = settings.settingsDir
    def toolkit = new File(consumerRoot, toolkitPath)
    def adapterApi = new File(consumerRoot, adapterApiPath)
    def adapterApiSource = new File(adapterApi, 'src/main/java')
    def athenaModels = new File(consumerRoot, athenaModelsPath)
    def athenaModelsSource = new File(athenaModels, 'src/main/java')
    def renderCore = new File(consumerRoot, renderCorePath)
    def renderCoreSource = new File(renderCore, 'src/main/java')

    if (!(expectedToolkitCommit ==~ /[0-9a-f]{40}/)
            || !new File(consumerRoot, '.git').exists()
            || !toolkit.isDirectory()
            || !new File(toolkit, '.git').exists()) {
        throw new GradleException(
                'Toolkit trust preflight is not configured or initialized. '
                        + "Run: git submodule update --init --recursive -- ${toolkitPath}"
        )
    }
    if (!(expectedAdapterApiCommit ==~ /[0-9a-f]{40}/)
            || !(expectedAdapterApiSourceTree ==~ /[0-9a-f]{40}/)
            || !adapterApi.isDirectory()
            || !new File(adapterApi, '.git').exists()
            || !adapterApiSource.isDirectory()) {
        throw new GradleException(
                'Adapter API trust preflight is not configured or initialized. '
                        + "Run: git submodule update --init --recursive -- ${adapterApiPath}"
        )
    }
    if (!(expectedAthenaModelsCommit ==~ /[0-9a-f]{40}/)
            || !(expectedAthenaModelsSourceTree ==~ /[0-9a-f]{40}/)
            || !athenaModels.isDirectory()
            || !new File(athenaModels, '.git').exists()
            || !athenaModelsSource.isDirectory()) {
        throw new GradleException(
                'Athena model trust preflight is not configured or initialized. '
                        + "Run: git submodule update --init --recursive -- ${athenaModelsPath}"
        )
    }
    if (!(expectedRenderCoreCommit ==~ /[0-9a-f]{40}/)
            || !(expectedRenderCoreSourceTree ==~ /[0-9a-f]{40}/)
            || !renderCore.isDirectory()
            || !new File(renderCore, '.git').exists()
            || !renderCoreSource.isDirectory()) {
        throw new GradleException(
                'Render-core trust preflight is not configured or initialized. '
                        + "Run: git submodule update --init --recursive -- ${renderCorePath}"
        )
    }

    def trustedGitOutput = {
        File repository, List<String> arguments, String operation ->
        def execution = settings.providers.exec {
            commandLine(['git', '-C', repository.absolutePath] + arguments)
            ignoreExitValue = true
            environment 'LC_ALL', 'C'
            environment 'GIT_OPTIONAL_LOCKS', '0'
        }
        def result = execution.result.get()
        def output = execution.standardOutput.asText.get().trim()
        def error = execution.standardError.asText.get().trim()
        if (result.exitValue != 0) {
            throw new GradleException(
                    "Unable to ${operation}: ${error ?: 'Git returned no diagnostic.'}"
            )
        }
        output
    }

    if (!trustedGitOutput(consumerRoot, ['rev-parse', '--show-prefix'],
            'verify the consumer root').isEmpty()) {
        throw new GradleException('settings.gradle must be at the Git worktree root')
    }

    def tree = trustedGitOutput(consumerRoot,
            ['ls-tree', 'HEAD', '--', toolkitPath],
            'read the committed toolkit gitlink').tokenize(' \t')
    def index = trustedGitOutput(consumerRoot,
            ['ls-files', '--stage', '--', toolkitPath],
            'read the indexed toolkit gitlink').tokenize(' \t')
    if (tree.size() != 4 || tree[0] != '160000' || tree[1] != 'commit'
            || tree[2] != expectedToolkitCommit || tree[3] != toolkitPath
            || index.size() != 4 || index[0] != '160000'
            || index[1] != expectedToolkitCommit || index[2] != '0'
            || index[3] != toolkitPath) {
        throw new GradleException('Committed/indexed toolkit gitlink does not match its pin')
    }

    def toolkitHead = trustedGitOutput(toolkit,
            ['rev-parse', '--verify', 'HEAD^{commit}'], 'read toolkit HEAD')
    def toolkitStatus = trustedGitOutput(toolkit,
            ['status', '--porcelain=v1', '--untracked-files=all',
             '--ignore-submodules=none'], 'verify the toolkit worktree')
    if (toolkitHead != expectedToolkitCommit || !toolkitStatus.isEmpty()) {
        throw new GradleException('Toolkit HEAD differs from the gitlink or is dirty')
    }

    def adapterApiTree = trustedGitOutput(consumerRoot,
            ['ls-tree', 'HEAD', '--', adapterApiPath],
            'read the committed adapter API gitlink').tokenize(' \t')
    def adapterApiIndex = trustedGitOutput(consumerRoot,
            ['ls-files', '--stage', '--', adapterApiPath],
            'read the indexed adapter API gitlink').tokenize(' \t')
    if (adapterApiTree.size() != 4 || adapterApiTree[0] != '160000'
            || adapterApiTree[1] != 'commit'
            || adapterApiTree[2] != expectedAdapterApiCommit
            || adapterApiTree[3] != adapterApiPath
            || adapterApiIndex.size() != 4 || adapterApiIndex[0] != '160000'
            || adapterApiIndex[1] != expectedAdapterApiCommit
            || adapterApiIndex[2] != '0' || adapterApiIndex[3] != adapterApiPath) {
        throw new GradleException(
                'Committed/indexed adapter API gitlink does not match its pin'
        )
    }
    def adapterApiHead = trustedGitOutput(adapterApi,
            ['rev-parse', '--verify', 'HEAD^{commit}'], 'read adapter API HEAD')
    def adapterApiTreeHash = trustedGitOutput(adapterApi,
            ['rev-parse', 'HEAD:src/main/java'], 'read adapter API source tree')
    def adapterApiStatus = trustedGitOutput(adapterApi,
            ['status', '--porcelain=v1', '--untracked-files=all',
             '--ignore-submodules=none'], 'verify the adapter API worktree')
    if (adapterApiHead != expectedAdapterApiCommit
            || adapterApiTreeHash != expectedAdapterApiSourceTree
            || !adapterApiStatus.isEmpty()) {
        throw new GradleException(
                'Adapter API HEAD/source tree differs from the pin or is dirty'
        )
    }

    def athenaModelsTree = trustedGitOutput(consumerRoot,
            ['ls-tree', 'HEAD', '--', athenaModelsPath],
            'read the committed Athena model gitlink').tokenize(' \t')
    def athenaModelsIndex = trustedGitOutput(consumerRoot,
            ['ls-files', '--stage', '--', athenaModelsPath],
            'read the indexed Athena model gitlink').tokenize(' \t')
    if (athenaModelsTree.size() != 4 || athenaModelsTree[0] != '160000'
            || athenaModelsTree[1] != 'commit'
            || athenaModelsTree[2] != expectedAthenaModelsCommit
            || athenaModelsTree[3] != athenaModelsPath
            || athenaModelsIndex.size() != 4 || athenaModelsIndex[0] != '160000'
            || athenaModelsIndex[1] != expectedAthenaModelsCommit
            || athenaModelsIndex[2] != '0' || athenaModelsIndex[3] != athenaModelsPath) {
        throw new GradleException(
                'Committed/indexed Athena model gitlink does not match its pin'
        )
    }

    def athenaModelsHead = trustedGitOutput(athenaModels,
            ['rev-parse', '--verify', 'HEAD^{commit}'], 'read Athena model HEAD')
    def athenaModelsTreeHash = trustedGitOutput(athenaModels,
            ['rev-parse', 'HEAD:src/main/java'], 'read Athena model source tree')
    def athenaModelsStatus = trustedGitOutput(athenaModels,
            ['status', '--porcelain=v1', '--untracked-files=all',
             '--ignore-submodules=none'], 'verify the Athena model worktree')
    if (athenaModelsHead != expectedAthenaModelsCommit
            || athenaModelsTreeHash != expectedAthenaModelsSourceTree
            || !athenaModelsStatus.isEmpty()) {
        throw new GradleException(
                'Athena model HEAD/source tree differs from the pin or is dirty'
        )
    }

    def renderCoreTree = trustedGitOutput(consumerRoot,
            ['ls-tree', 'HEAD', '--', renderCorePath],
            'read the committed render-core gitlink').tokenize(' \t')
    def renderCoreIndex = trustedGitOutput(consumerRoot,
            ['ls-files', '--stage', '--', renderCorePath],
            'read the indexed render-core gitlink').tokenize(' \t')
    if (renderCoreTree.size() != 4 || renderCoreTree[0] != '160000'
            || renderCoreTree[1] != 'commit'
            || renderCoreTree[2] != expectedRenderCoreCommit
            || renderCoreTree[3] != renderCorePath
            || renderCoreIndex.size() != 4 || renderCoreIndex[0] != '160000'
            || renderCoreIndex[1] != expectedRenderCoreCommit
            || renderCoreIndex[2] != '0' || renderCoreIndex[3] != renderCorePath) {
        throw new GradleException(
                'Committed/indexed render-core gitlink does not match its pin'
        )
    }

    def renderCoreHead = trustedGitOutput(renderCore,
            ['rev-parse', '--verify', 'HEAD^{commit}'], 'read render-core HEAD')
    def renderCoreTreeHash = trustedGitOutput(renderCore,
            ['rev-parse', 'HEAD:src/main/java'], 'read render-core source tree')
    def renderCoreStatus = trustedGitOutput(renderCore,
            ['status', '--porcelain=v1', '--untracked-files=all',
             '--ignore-submodules=none'], 'verify the render-core worktree')
    if (renderCoreHead != expectedRenderCoreCommit
            || renderCoreTreeHash != expectedRenderCoreSourceTree
            || !renderCoreStatus.isEmpty()) {
        throw new GradleException(
                'Render-core HEAD/source tree differs from the pin or is dirty'
        )
    }

    def gradleBuild = new File(toolkit, 'gradle')
    if (!new File(gradleBuild, 'settings.gradle').isFile()) {
        throw new GradleException('Pinned toolkit has no Gradle convention build')
    }
    includeBuild(gradleBuild)

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'bluemap-cobblefurnies-addon'

def expectedBlueMapCommit = '7e07f4e74ec1e92a6ead9aa1e66054af3e133aac'
def expectedBlueMapApiCommit = '285c9a60eff3ac2b0cab308ce1058d1565be0971'
def blueMapSourcePath = providers.gradleProperty('bluemapSourcePath')
        .getOrElse('../bluemap-backport')
def blueMapSource = file(blueMapSourcePath)

if (!blueMapSource.isDirectory()) {
    throw new GradleException(
            "BlueMap source checkout not found at ${blueMapSource}. "
                    + 'Set -PbluemapSourcePath=<path> to the exact workspace backport.'
    )
}

def gitOutput = { File repository, String... arguments ->
    providers.exec {
        commandLine(['git', '-C', repository.absolutePath] + arguments.toList())
    }.standardOutput.asText.get().trim()
}

def blueMapHead = gitOutput(blueMapSource, 'rev-parse', 'HEAD')
if (blueMapHead != expectedBlueMapCommit) {
    throw new GradleException(
            "Refusing BlueMap ${blueMapHead}; expected ${expectedBlueMapCommit}"
    )
}
def blueMapApiSource = new File(blueMapSource, 'api')
def blueMapApiHead = gitOutput(blueMapApiSource, 'rev-parse', 'HEAD')
if (blueMapApiHead != expectedBlueMapApiCommit) {
    throw new GradleException(
            "Refusing BlueMapAPI ${blueMapApiHead}; expected ${expectedBlueMapApiCommit}"
    )
}

includeBuild(blueMapSource) {
    dependencySubstitution {
        substitute module('de.bluecolored:bluemap-core') using project(':core')
    }
}
